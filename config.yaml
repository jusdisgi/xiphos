meta:
  engine: 4.1.0
  name: xiphos
  version: 0.1
  ref: &kb_ref "xiphos v0.1"
  author: huntercook
  url: &kb_url https://github.com/jusdisgi/xiphos
  footprint: &switch_footprint "switch_pg1316s"
  switch:
    $extends: presets.pg1316s
    # Key and keycap measures
    kx: 16
    ky: 16
    ks: 18 # Choc spacing despite the smaller keys
    kp: 17
    keycw: 17.5 # keycap width (cherry: 18, choc: 17.5)
    keych: 16.5 # keycap height (cherry: 18, choc: 16.5)

presets:
  # These presets provide different layout options
  # Select a preset in the `units` section below
  # Note: The appropriate switch footprint will still need to be set in the `pcb` section
  mx:
    # Key and keycap measures
    kx: u # spacing between key centers (X-axis)
    ky: u # spacing between key centers (Y-axis)
    ks: 19 # horizontal space between columns (default: 19)
    kp: 19 # vertical padding between keys (deafult: 19)
    kcow: 14 # key cutout hole width (cherry: 14, choc: 13.8)
    kcoh: 14 # key cutout hole height (cherry: 14, choc: 13.8)
    keycw: 18 # keycap width (cherry: 18, choc: 17.5)
    keych: 18 # keycap height (cherry: 18, choc: 16.5)
    led_pos_x: 0 # Led X position relative to the switch center
    led_pos_y: -4.75 # Led Y position relative to the switch center
    led_rotation: 180 # Led rotation
    vertical_underglow_shift: -0.5 kp # How much to shift underglow leds tied to keys
    vertical_diode_shift: 1.325 # How much to shift to avoid overlap
    horizontal_diode_shift: 7.4
    diode_rotation: 0 # Diode rotation
    switch_rotation: 0 # Hotswap north, led south
  choc_v1:
    # Key and keycap measures
    kx: cx # spacing between key centers (X-axis)
    ky: cy # spacing between key centers (Y-axis)
    ks: 18.5 # horizontal space between columns (default: 19)
    kp: 17.5 # vertical padding between keys (deafult: 19)
    kcow: 13.8 # key cutout hole width (cherry, choc v2: 14, choc v1: 13.8)
    kcoh: 13.8 # key cutout hole height (cherry, choc v2: 14, choc v1: 13.8)
    keycw: 17.5 # keycap width (cherry: 18, choc: 17.5)
    keych: 16.5 # keycap height (cherry: 18, choc: 16.5)
    led_pos_x: 0 # Led X position relative to the switch center
    led_pos_y: 4.7 # Led Y position relative to the switch center
    led_rotation: 0 # Led rotation
    vertical_underglow_shift: -kp + 7.8  # How much to shift underglow leds tied to keys
    vertical_diode_shift: 1.5 # How much to shift to avoid overlap
    horizontal_diode_shift: -0.5 kcow - 0.85
    diode_rotation: -180 # Diode rotation
    switch_rotation: 180 # Hotswap south, led north
  choc_v2:
    # Key and keycap measures
    $extends: presets.choc_v1
    kx: u # spacing between key centers (X-axis)
    ky: u # spacing between key centers (Y-axis)
    ks: 19 # horizontal space between columns (default: 19)
    kp: 19 # vertical padding between keys (deafult: 19)
    keycw: 18 # keycap width (cherry: 18, choc: 17.5)
    keych: 18 # keycap height (cherry: 18, choc: 16.5)
  pg1316s:
    # Key and keycap measures
    kx: 16
    ky: 16
    ks: 17 # typical spacing, for example mikefive uses 17x17
    kp: 17
    kcow: 16 # key cutout hole width (Equal to stock keycaps...caps bottom out by design)
    kcoh: 16 # key cutout hole height (Equal to stock keycaps...caps bottom out by design)
    keycw: 16 # keycap width (cherry: 18, choc: 17.5, stock PG1316S: 16)
    keych: 16 # keycap height (cherry: 18, choc: 16.5, stock PG1316S: 16)
    led_pos_x: 0 # Led X coord from key center. 
    led_pos_y: 2.5 # Led Y coord from key center. 2.5 is center of the slot.
    led_rotation: 0 # Led rotation
    vertical_underglow_shift: -0.5 kp  # How much to shift underglow leds tied to keys
    vertical_diode_shift: 1.5 # How much to shift to avoid overlap
    horizontal_diode_shift: -0.5 kcow - 0.85
    diode_rotation: 0 # Diode rotation
    switch_rotation: 0 #LED north
    

units:
  # The following statements will make the content of the preset
  # available in the units context
  $extends: meta.switch

  hand_rotation: 8

  # Physical measures
  m1_screw_radius: 0.6
  m2_screw_radius: 1.1
  m1_screw_diameter: m1_screw_radius * 2
  m2_screw_diameter: m2_screw_radius * 2
  m1_screw_head_radius: 1.05
  m2_screw_head_radius: 2.05
  m1_screw_head_diameter: m1_screw_head_radius * 2
  m2_screw_head_diameter: m2_screw_head_radius * 2
  m1_nut_radius: 0.95 # m1 heat-set nuts w/ 2.0mm diam need 1.9mm hole in FDM case
  m2_nut_radius: 1.55 # m2 ones are 3.2mm and use 3.1mm hole.
  m1_nut_diameter: m1_nut_radius * 2
  m2_nut_diameter: m2_nut_radius * 2
  mag2_hole_radius: 1.1 # hole to create for 2mm cylinder magnet
  mag3_hole_radius: 1.55
  mag5_hole_radius: 2.6
  via_size: 0.5 # JLCPCB min 0.56 | KiCad default 0.8
  via_drill: 0.3 # JLCPCB min 0.3 | KiCad default 0.4

  # Case variables
  case_wall_thickness: 1.0
  pcb_to_case_wall_tolerance: 0.2
  bottom_plate_thickness: 1.0

  # Finger column stagger
  stagger_finger_ring: 11   # Stagger of ring above pinky! Normally called pinky stagger.
  stagger_finger_middle: 6  # Middle above ring by 6mm.
  stagger_finger_index: -5  # Index 5mm below middle.
  stagger_finger_inner: -2  # Inner 2mm below index.

  # Finger column splay
  splay_finger_ring: -5    # Again this is pinky splay to normal people.
  splay_finger_middle: -3  # Middle splayed from ring.
  splay_finger_index: 0    # Don't splay index.
  splay_finger_inner: 0    # And certainly not inner.

  # Thumb splay
  splay_thumb_tucky: -15
  splay_thumb_reachy: -15

points:
  zones:
    # Fingers. Why the **** does everybody call the finger keys "matrix" when 
    # the thumb keys are also part of that same diode matrix? If you want
    # to specify the keys that are not the thumb keys, there's a fairly
    # obvious, non-jargon word for the job:
    finger:
      key:
        padding: kp
        spread: ks
      anchor:
        rotate: hand_rotation
        shift: [97.5, -166.3] # Center board on A3 page (board bbox center -> 210,148.5)
      columns:
        pinky:
        ring:
          key:
            stagger: stagger_finger_ring
            splay: splay_finger_ring
            spread: ks+0.7
        middle:
          key:
            stagger: stagger_finger_middle
            splay: splay_finger_middle
            spread: ks+0.4
        index:
          key:
            stagger: stagger_finger_index
            splay: splay_finger_index
        inner:
          key:
            stagger: stagger_finger_inner
            splay: splay_finger_inner
      rows:
        bottom:
        home:
        top:

    thumb:
      key:
        #padding: ks+0.5
        #spread: kp
      anchor:
        ref: finger_inner_bottom
        shift: [-2.5,-20]
      columns:
        tucky:
          key:
            splay: splay_thumb_tucky
        reachy:
          key:
            splay: splay_thumb_reachy
            shift: [3,-2]
      rows:
        fan:

    # Single outboard pinky key, intended as a SHIFT key (xiphos addition,
    # takes the board from 34 to 36 keys). Sits one column-spread outboard of
    # the pinky home key, dropped a few mm to suit the natural pinky reach.
    # Inherits the pinky column's orientation by anchoring to finger_pinky_home.
    shift:
      anchor:
        ref: finger_pinky_home
        shift: [-ks, -3]
      columns:
        outer:
      rows:
        mid:

# Helper points

# These screw holes are numbered as one sequence regardless of size. 
# That way if I change the size of one I don't have to re-number the 
# whole list. Ask me how I came up with this idea...
    
    #Top Right Corner
    m2_1:
      anchor:
        - ref: finger_inner_top
          shift: [30.8,8]
    m2_3:
      anchor:
        - ref: finger_inner_bottom
          shift: [19,8]
    m2_4:
      anchor:
        - ref: finger_inner_bottom
          shift: [11.5,-14]
    m2_5:
      anchor:
        - ref: finger_inner_bottom
          shift: [30,-22]
    # Bottom Right Corner
    m1_6:      
      anchor:
        - ref: thumb_reachy_fan
          shift: [10,-10.5]
    m2_8:      
      anchor:
        - ref: thumb_tucky_fan
          shift: [-6,-11]
    m2_10:      
      anchor:
        - ref: finger_middle_bottom
          shift: [-6,-13]
    m2_12:      
      anchor:
        - ref: finger_middle_bottom
          shift: [-27,-32]
    #Bottom Left Corner
    m2_13:      
      anchor:
        - ref: finger_pinky_bottom
          shift: [-10,-10.7]
    m1_14:
      anchor:
        - ref: shift_outer_mid
          shift: [-10,0]
    #Top Left Corner
    m2_15:      
      anchor:
        - ref: finger_pinky_top
          shift: [-10,10.5]
    m2_16:      
      anchor:
        - ref: finger_ring_top
          shift: [-12,5]
    m1_17:      
      anchor:
        - ref: finger_middle_top
          shift: [0,10.3]
    m2_18:      
      anchor:
        - ref: finger_index_top
          shift: [8,11]
    m1_19:      
      anchor:
        - ref: finger_inner_top
          shift: [6,10.5]

  mirror:
    ref: thumb_reachy_fan
    distance: 3kx

outlines:
  shape_left:
    - what: polygon
      operation: stack
      points:
        - ref: thumb_reachy_fan
          shift: [12.5,-12.5]
        - ref: thumb_tucky_fan
          shift: [-12.5,-12.5]
        - ref: finger_pinky_bottom
          shift: [-12.5,-12.5]
        - ref: shift_outer_mid
          shift: [-12.5,-12.5]
        - ref: shift_outer_mid
          shift: [-12.5,12]
        - ref: finger_pinky_top
          shift: [-12.5,12]
        - ref: finger_middle_top
          shift: [-10,12]
        - ref: finger_middle_top
          shift: [10,12]
        - ref: finger_inner_top
          shift: [13,10.7]
        - ref: finger_inner_top
          shift: [33,10.7]
        - ref: finger_inner_bottom
          shift: [33,-26.2]
      fillet: 3
  mcu_slot_left:
    - what: polygon
      operation: stack
      points:
        - ref: finger_inner_top
          shift: [12.5,10.71]
        - ref: finger_inner_top
          shift: [12.5,-22.4]
        - ref: finger_inner_top
          shift: [25.5,-22.4]
        - ref: finger_inner_top
          shift: [25.5,10.71]
      fillet: 0.5
  batt_slot_left:
    - what: polygon
      operation: stack
      points:
        - ref: finger_middle_bottom
          shift: [-24.5,-40]
        - ref: finger_middle_bottom
          shift: [-24.5,-16.5]
        - ref: finger_middle_bottom
          shift: [22,-16.5]
        - ref: finger_middle_bottom
          shift: [22,-40]
      fillet: 0.5

  shape_right:
    - what: polygon
      operation: stack
      points:
        - ref: mirror_thumb_reachy_fan
          shift: [12.5,-12.5]
        - ref: mirror_thumb_tucky_fan
          shift: [-12.5,-12.5]
        - ref: mirror_finger_pinky_bottom
          shift: [-12.5,-12.5]
        - ref: mirror_shift_outer_mid
          shift: [-12.5,-12.5]
        - ref: mirror_shift_outer_mid
          shift: [-12.5,12]
        - ref: mirror_finger_pinky_top
          shift: [-12.5,12]
        - ref: mirror_finger_middle_top
          shift: [-10,12]
        - ref: mirror_finger_middle_top
          shift: [10,12]
        - ref: mirror_finger_inner_top
          shift: [13,10.7]
        - ref: mirror_finger_inner_top
          shift: [33,10.7]
        - ref: mirror_finger_inner_bottom
          shift: [33,-26.2]
      fillet: 3
  mcu_slot_right:
    - what: polygon
      operation: stack
      points:
        - ref: mirror_finger_inner_top
          shift: [12.5,10.71]
        - ref: mirror_finger_inner_top
          shift: [12.5,-22.4]
        - ref: mirror_finger_inner_top
          shift: [25.5,-22.4]
        - ref: mirror_finger_inner_top
          shift: [25.5,10.71]
      fillet: 0.5
  batt_slot_right:
    - what: polygon
      operation: stack
      points:
        - ref: mirror_finger_middle_bottom
          shift: [-24.5,-40]
        - ref: mirror_finger_middle_bottom
          shift: [-24.5,-16.5]
        - ref: mirror_finger_middle_bottom
          shift: [22,-16.5]
        - ref: mirror_finger_middle_bottom
          shift: [22,-40]
      fillet: 0.5

# These are the actual outlines the PCBs use
  board_left:
    - name: shape_left
    - operation: subtract
      name: mcu_slot_left
    - operation: subtract
      name: batt_slot_left
  board_right:
    - name: shape_right
    - operation: subtract
      name: mcu_slot_right
    - operation: subtract
      name: batt_slot_right
  


  # There is no case generation in this config; these outlines are just to
  # generate DXF files to pull into onshape for case design.
  # Also not doing them for the right half; will design case for the left
  # half and then mirror the part.
  case_inner_wall_left:
    - what: outline
      name: shape_left
      expand: pcb_to_case_wall_tolerance
  case_outer_wall_left:
    - what: outline
      name: case_inner_wall_left
      expand: case_wall_thickness
  case_keycuts_left:
    - what: rectangle
      where: /^finger|^thumb|^shift/
      size: [ks,kp]
  keycap_outlines_left:
    - what: rectangle
      fillet: 2
      where: /^finger|^thumb|^shift/
      size: [keycw, keych]
  _m1_screws:
    - what: circle
      where: /^m1/
      radius: m1_screw_radius
  _m2_screws:
    - what: circle
      where: /^m2/
      radius: m2_screw_radius
  screws:
    - name: _m1_screws
    - operation: add
      name: _m2_screws
  _m1_screw_heads:
    - what: circle
      where: /^m1/
      radius: m1_screw_head_radius
  _m2_screw_heads:
    - what: circle
      where: /^m2/
      radius: m2_screw_head_radius
  screw_heads:
    - name: _m1_screw_heads
    - operation: add
      name: _m2_screw_heads
  _m1_nuts:
    - what: circle
      where: /^m1/
      radius: m1_nut_radius
  _m2_nuts:
    - what: circle
      where: /^m2/
      radius: m2_nut_radius
  nuts:
    - name: _m1_nuts
    - operation: add
      name: _m2_nuts

pcbs:
# ONE combined board: both halves on a single PCB as two separate board outlines
# (left + right). Each half is electrically independent (its own nice!nano +
# battery); nets are namespaced L_ / R_ so the halves never collide on shared
# rails (GND/RAW/3V3/BAT_P/RST) and the combined netlist/BOM is unambiguous.
#
# Generated as xiphos_unrouted.kicad_pcb; copy to xiphos.kicad_pcb to route
# (keeps routing safe from regen overwrites).
#
# Deterministic refs (left group first): S1-S18 = left keys, S19-S36 = right;
# MCU1/CONN1/PWR1/RST1/MAG1 = left, *2 = right; MH1-30 = mounting holes.
  xiphos_unrouted:
    template: kicad8
    outlines:
      left:
        outline: board_left
      right:
        outline: board_right
    footprints:

# ===== LEFT HALF (split central) : L_ nets =====
      mcu_left:
          what: mcu_nice_nano_smd
          where:
            ref: finger_inner_top
            shift: [19,-5.8]
          params:
            reverse_mount: true
            P1: L_finger_inner_home
            P1_label: D1
            P0: L_shift_outer_mid
            P0_label: D0
            P2: L_finger_pinky_bottom
            P2_label: D2
            P3: L_finger_ring_bottom
            P3_label: D3
            P4: L_finger_middle_bottom
            P4_label: D4
            P5: L_finger_index_bottom
            P5_label: D5
            P6: L_finger_inner_bottom
            P6_label: D6
            P7: L_finger_pinky_top
            P7_label: D7
            P8: L_thumb_tucky_fan
            P8_label: D8
            P9: L_thumb_reachy_fan
            P9_label: D9
            P10: L_finger_index_home
            P10_label: D10
            P16: L_finger_middle_home
            P16_label: D16
            P14: L_finger_ring_home
            P14_label: D14
            P15: L_finger_pinky_home
            P15_label: D15
            P18: L_finger_ring_top
            P18_label: D18
            P19: L_finger_middle_top
            P19_label: D19
            P20: L_finger_index_top
            P20_label: D20
            P21: L_finger_inner_top
            P21_label: D21
            RAW: L_RAW
            GND: L_GND
            RST: L_RST
            P101: L_P101
            P102: L_P102
            P107: L_P107
            VCC: L_3V3
            VCC_label: 3V3
            mcu_3dmodel_filename: '\${INFUSED_KIM_MODELS}/Nice_Nano_V2.step'
            mcu_3dmodel_xyz_rotation: [0, 0, 0]
            mcu_3dmodel_xyz_offset: [0, 0, 0]
      key_switches_left:
        what: *switch_footprint
        where: /^finger|^thumb|^shift/
        adjust:
          rotate: switch_rotation
        params:
          from: "L_{{zone.name}}_{{col.name}}_{{row}}"
          to: L_GND
          mp_net: L_GND
          reversible: false
          side: 'F'
          large_p1: false
          square_p1: true
          square_p2: true
          shift_p2: false
          small_mp: false
          pad_vias: false
          pad_via_size: via_size
          pad_via_hole: via_drill
          mp_vias: false
          mp_via_size: via_size
          mp_via_hole: via_drill
          mp_gnd: true
          key_3dmodel_filename: '\${HLC_MODELS}/PG1316S.STEP'
          key_3dmodel_xyz_offset: [-4.25, -7.25, -10.25]
      battery_switch_left:
        what: power_switch_smd_side
        where:
          ref: finger_inner_bottom
          shift: [30.75,-12]
          rotate: 0
        params:
          from: L_RAW
          to: L_BAT_P
          invert_behavior: true
          switch_3dmodel_filename: '\${INFUSED_KIM_MODELS}/Switch_Power.step'
          switch_3dmodel_xyz_rotation: [-90, 0, -90]
      reset_switch_left:
        what: reset_switch_smd_side
        where:
          ref: finger_inner_bottom
          shift: [30,-1]
          rotate: -90
        params:
          from: L_GND
          to: L_RST
          reset_switch_3dmodel_filename: '\${INFUSED_KIM_MODELS}/Switch_Reset.step'
          reset_switch_3dmodel_xyz_rotation: [-90, 0, 180]
      battcon_left:
      # Regular Molex Pico-EZmate, 1.20mm pitch (ceoloide). Placement verified
      # vs hand-placed connector in slimsplaydy_both_close: rotate 0, shift
      # ~[5,-12] to <0.5mm. No 3D model in this footprint.
        what: battery_connector_molex_pico_ezmate_1x02
        params:
          BAT_P: L_BAT_P
          BAT_N: L_GND
        where:
          ref: finger_middle_bottom
          shift: [5,-12]
          rotate: 0
      magring_left:
        what: magsafe_silkscreen
        where:
          ref: finger_index_home
          shift: [-8,0]
        params:
          side: B
      m1_screwholes_left:
        what: mounting_hole_npth
        where: /^m1/
        params:
          hole_size: m1_screw_diameter
          hole_drill: m1_screw_diameter
      m2_screwholes_left:
        what: mounting_hole_npth
        where: /^m2/
        params:
          hole_size: m2_screw_diameter
          hole_drill: m2_screw_diameter

# ===== RIGHT HALF (split peripheral) : R_ nets =====
      mcu_right:
          what: mcu_nice_nano_smd
          where:
            ref: mirror_finger_inner_top
            shift: [19,-5.8]
          params:
            reverse_mount: true
            P1: R_finger_inner_home
            P1_label: D1
            P0: R_shift_outer_mid
            P0_label: D0
            P2: R_finger_pinky_bottom
            P2_label: D2
            P3: R_finger_ring_bottom
            P3_label: D3
            P4: R_finger_middle_bottom
            P4_label: D4
            P5: R_finger_index_bottom
            P5_label: D5
            P6: R_finger_inner_bottom
            P6_label: D6
            P7: R_finger_pinky_top
            P7_label: D7
            P8: R_thumb_tucky_fan
            P8_label: D8
            P9: R_thumb_reachy_fan
            P9_label: D9
            P10: R_finger_index_home
            P10_label: D10
            P16: R_finger_middle_home
            P16_label: D16
            P14: R_finger_ring_home
            P14_label: D14
            P15: R_finger_pinky_home
            P15_label: D15
            P18: R_finger_ring_top
            P18_label: D18
            P19: R_finger_middle_top
            P19_label: D19
            P20: R_finger_index_top
            P20_label: D20
            P21: R_finger_inner_top
            P21_label: D21
            RAW: R_RAW
            GND: R_GND
            RST: R_RST
            P101: R_P101
            P102: R_P102
            P107: R_P107
            VCC: R_3V3
            VCC_label: 3V3
            mcu_3dmodel_filename: '\${INFUSED_KIM_MODELS}/Nice_Nano_V2.step'
            mcu_3dmodel_xyz_rotation: [0, 0, 0]
            mcu_3dmodel_xyz_offset: [0, 0, 0]
      key_switches_right:
        what: *switch_footprint
        where: /^mirror_finger|^mirror_thumb|^mirror_shift/
        adjust:
          rotate: switch_rotation
        params:
          from: "R_{{zone.name}}_{{col.name}}_{{row}}"
          to: R_GND
          mp_net: R_GND
          reversible: false
          side: 'F'
          large_p1: false
          square_p1: true
          square_p2: true
          shift_p2: false
          small_mp: false
          pad_vias: false
          pad_via_size: via_size
          pad_via_hole: via_drill
          mp_vias: false
          mp_via_size: via_size
          mp_via_hole: via_drill
          mp_gnd: true
          key_3dmodel_filename: '\${HLC_MODELS}/PG1316S.STEP'
          key_3dmodel_xyz_offset: [-4.25, -7.25, -10.25]
      battery_switch_right:
        what: power_switch_smd_side
        where:
          ref: mirror_finger_inner_bottom
          shift: [30.75,-12]
          rotate: 180
        params:
          from: R_RAW
          to: R_BAT_P
          invert_behavior: false
          switch_3dmodel_filename: '\${INFUSED_KIM_MODELS}/Switch_Power.step'
          switch_3dmodel_xyz_rotation: [-90, 0, -90]
